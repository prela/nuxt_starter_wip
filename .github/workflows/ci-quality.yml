name: CI Quality

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Ensure sharp uses bundled binaries; stable E2E previews
      SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
      NODE_ENV: production
      JWT_SECRET: ci-jwt-secret
      NUXT_CSRF_SECRET: ci-csrf-secret

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium

      - name: Prepare Nuxt for testing
        run: pnpm exec nuxt prepare

      - name: Run quality gates
        run: pnpm ci:quality

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: reports/coverage

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright-report

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-json
          path: reports/test-results.json
